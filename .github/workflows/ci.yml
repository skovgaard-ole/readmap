name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

concurrency:
  # A new push to the same branch cancels the run still going for the old one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: when a failure is
      # platform-specific, seeing which ones passed is the diagnosis.
      fail-fast: false
      matrix:
        # The oldest and newest supported Python on all three platforms, plus
        # the versions in between on Linux. Eight jobs, ~10 s of tests each.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        # No DISPLAY, no MPLBACKEND, no Ghostscript on any of these runners.
        # readmap is headless by construction (code_structure.md invariant 12),
        # so a green Linux job here is that invariant being tested rather than
        # asserted.
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
